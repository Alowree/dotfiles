configurations:
  - host: twineintlcom.securemail.hk
    port: 993
    tls: true
    tlsOptions:
      rejectUnauthorized: false
      starttls: false
    username: alowree@twineintl.com
    alias: twineintl
    passwordCmd: |
      if [[ -x /opt/homebrew/bin/pass ]]; then
        /opt/homebrew/bin/pass Email/twineintl
      elif [[ -x /usr/sbin/pass ]]; then
        /usr/sbin/pass Email/twineintl
      else
        pass Email/twineintl
      fi
    boxes:
      - mailbox: INBOX
        # interval: 10
        # # Use $HOME for cross-platform compatibility may not work
        # # Use /Users/alowree for testing first - see if `mbsync twine` now works
        # onNewMail: "/Users/alowree/.local/bin/mail-sync-twine"
        # onChangedMail: "/Users/alowree/.local/bin/mail-sync-twine"
        # onNewMailPost: "/Users/alowree/.local/bin/notify-mail 'New email received in Twine' 'Twine Mail'"
      - mailbox: INBOX
        interval: 10
        onNewMail: |
          # Detect OS and use appropriate script path
          if [[ "$(uname)" == "Darwin" ]]; then
            /Users/alowree/.local/bin/mail-sync-twine
          else
            /home/alowree/.local/bin/mail-sync-twine
          fi
        onChangedMail: |
          if [[ "$(uname)" == "Darwin" ]]; then
            /Users/alowree/.local/bin/mail-sync-twine
          else
            /home/alowree/.local/bin/mail-sync-twine
          fi
        onNewMailPost: |
          if [[ "$(uname)" == "Darwin" ]]; then
            /Users/alowree/.local/bin/notify-mail 'New email received in Twine' 'Twine Mail'
          else
            /home/alowree/.local/bin/notify-mail 'New email received in Twine' 'Twine Mail'
          fi
