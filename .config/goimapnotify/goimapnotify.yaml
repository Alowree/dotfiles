configurations:
  - host: twineintlcom.securemail.hk
    port: 993
    tls: true
    tlsOptions:
      rejectUnauthorized: false
      starttls: false
    username: alowree@twineintl.com
    alias: twineintl
    passwordCmd: |
      if [[ -x /opt/homebrew/bin/pass ]]; then
        /opt/homebrew/bin/pass Email/twineintl
      elif [[ -x /usr/sbin/pass ]]; then
        /usr/sbin/pass Email/twineintl
      else
        pass Email/twineintl
      fi
    boxes:
      - mailbox: INBOX
        interval: 10
        onNewMail: |
          # Detect OS and use appropriate unified script path
          if [[ "$(uname)" == "Darwin" ]]; then
            /Users/alowree/.config/goimapnotify/bin/mail-sync-twine
          else
            /home/alowree/.config/goimapnotify/bin/mail-sync-twine
          fi
        onChangedMail: |
          if [[ "$(uname)" == "Darwin" ]]; then
            /Users/alowree/.config/goimapnotify/bin/mail-sync-twine
          else
            /home/alowree/.config/goimapnotify/bin/mail-sync-twine
          fi
        onNewMailPost: |
          if [[ "$(uname)" == "Darwin" ]]; then
            /Users/alowree/.config/goimapnotify/bin/notify-mail 'Twine Mail' 'New email received in Twine'
          else
            /home/alowree/.config/goimapnotify/bin/notify-mail 'Twine Mail' 'New email received in Twine'
          fi
