# 设置主界面主题为 dark 或 light
[general]
theme = "dark"

# 启动时的默认路径
default_path = "~"

# 自定义快捷键绑定
[keybindings]
quit = "q"        # 退出
copy = "y"        # 复制文件
paste = "p"       # 粘贴文件
delete = "d"      # 删除文件

# 界面相关配置
[ui]
preview_enabled = true     # 是否启用文件预览
show_hidden_files = true   # 显示隐藏文件
columns = 2                # 文件列表列数

# 搜索行为配置
[search]
case_sensitive = false  # 搜索是否区分大小写
search_timeout = 30     # 搜索超时时间（秒）

[manager]
ratio = [2,2,4]
show_hidden = true
show_symlink = true

[opener]
play = [
	{ run = 'mpv "$@"', orphan = true, for = "unix" },
	{ run = '"C:\Program Files\mpv.exe" %*', orphan = true, for = "windows" }
]
edit = [
	{ run = '$EDITOR "$@"', block = true, for = "unix" },
	{ run = "%EDITOR% %*",  block = true, for = "windows" },
]
open = [
	{ run = 'xdg-open "$@"', desc = "Open" },
]

[open]
prepend_rules = [
	{ name = "*.json", use = "edit" },

	# Multiple openers for a single rule
	{ name = "*.html", use = [ "open", "edit" ] },
]
append_rules = [
	{ name = "*", use = "my-fallback" },
]
