# https://github.com/nbaud/nico-yazi-config/blob/main/yazi.toml
# 2026-05-15
[mgr]
show_header = true
ratio = [2, 3, 5]
show_hidden = true
show_symlink = true
sort_dir_first = true
sort_by = "alphabetical"

[preview]
# Maximum preview width/height for images. 
# Run `yazi --clear-cache` after changing this for it to take effect.
max_width = 10000
max_height = 10000

# Configure available openers that can be used in `[open]`:
[opener]
# Define your editor here
#
# Option A
edit = [{ run = '${EDITOR:-nvim} "$@"', desc = "Neovim", block = true }]
#
# Option B
# edit = [{ run = '${EDITOR:-vim} "$@"', desc = "Edit", block = true }]

# Although already in yazi-default.toml
# we still need to explicitly set this reveal here
# Otherwise, "Show EXIF" will appear as the last menu item
# after pressing `O` to open file interactively
reveal = [
  { run = 'open -R "$1"', desc = "View with Finder", for = "macos" },
  { run = 'explorer /select, "%1"', orphan = true, desc = "View with Explorer", for = "windows" },
]
vscode = [{ run = 'code "$@"', desc = "VS Code", orphan = true }]
# typora = [{ run = 'open -a "Typora" "$@"', desc = "Typora", orphan = true }]
# Typora opener with platform detection
# Using run_if to check for macOS vs Linux
typora = [
  { 
    run = 'open -a "Typora" "$@"', 
    desc = "Typora (macOS)", 
    orphan = true, 
    for = "macos" 
  },
  { 
    run = 'typora "$@"', 
    desc = "Typora (Linux)", 
    orphan = true, 
    for = "linux",
    # Optional: fallback for Arch-specific command if needed
    # run_if = "command -v typora",  # Uncomment if you want to check if installed
  },
]
# Word opener with platform detection
word = [
  { 
    run = 'open -a "Microsoft Word" "$@"', 
    desc = "Microsoft Word (macOS)", 
    orphan = true, 
    for = "macos" 
  },
  { 
    run = 'libreoffice --writer "$@"', 
    desc = "LibreOffice Writer (Linux)", 
    orphan = true, 
    for = "linux" 
  },
]
# Excel opener with platform detection
excel = [
  { 
    run = 'open -a "Microsoft Excel" "$@"', 
    desc = "Microsoft Excel (macOS)", 
    orphan = true, 
    for = "macos" 
  },
  { 
    run = 'libreoffice --calc "$@"', 
    desc = "LibreOffice Calc (Linux)", 
    orphan = true, 
    for = "linux" 
  },
]
# Keynote opener with platform detection
keynote = [
  { 
    run = 'open -a "Keynote" "$@"', 
    desc = "Keynote (macOS)", 
    orphan = true, 
    for = "macos" 
  },
  { 
    run = 'libreoffice --impress "$@"', 
    desc = "LibreOffice Impress (Linux)", 
    orphan = true, 
    for = "linux" 
  },
]
# Custom defined openers for PDFs
zathura = [
  { run = 'zathura "$@"', detach = true, desc = "Open PDF with Zathura" },
]
preview = [{ run = 'open -a "Preview" "$@"', orphan = true, desc = "Preview" }]
mpv = [{ run = 'mpv "$@"', desc = "mpv", orphan = true }]
# Extract compressed archive
extract = [
  { run = 'ouch d -y "$@"', desc = "Extract here with ouch", for = "unix" },
]
# view-viu = [{ run = 'viu "$@"; echo "Press enter to exit"; read', desc = "View with viu", block = true }]

# The `[open]` block behaves differently depending on which key you use
# `prepend_rules`: merges your rules to the top of default list
# `append_rules`: merges your rules to the bottom of the default list
# `rules`: completely replaces the entire default list

# Change [open] rules to prepend_rules so Yazi's default fallbacks catch the rest
[open]
prepend_rules = [
  # 0. Markdown files with Typora
  { url = "*.{md,MD,markdown}", use = [
    "edit",
    "typora",
    "reveal",
  ] },

  # 1. PDF opening
  { mime = "application/pdf", use = [
    "zathura",
    "preview",
    "reveal",
  ] },

  # 3. Video opening
  { mime = "video/*", use = [
    "mpv",
    "reveal",
  ] },
  { url = "*.{mp4,mkv,avi,mov,wmv,flv,webm}", use = [
    "mpv",
    "reveal",
  ] },

  # 4. Office files
  { url = "*.{docx,doc}", use = [
    "word",
    "reveal",
  ] },
  { url = "*.{xlsx,xls}", use = [
    "excel",
    "reveal",
  ] },
  { url = "*.{csv,tsv}", use = [
    "edit",
    "excel",
    "reveal",
  ] },
  { url = "*.{pptx,ppt}", use = [
    "keynote",
    "reveal",
  ] },

  # 5. Archive extraction
  # Press `o` or `Enter` to open/extract the compressed archive
  { mime = "application/{*zip,tar,bzip2,7z*,rar,xz,zstd,java-archive}", use = [
    "extract",
    "reveal",
  ] },

  # 6. Other text files with editor
  # but `o` or `Enter` will not open an empty prompt.zsh file
  { mime = "text/*", use = [
    "edit",
    "vscode",
    "typora",
    "reveal",
  ], append = false },
  { url = "*.{yml,yaml,toml,lua}", use = [
    "edit",
    "reveal",
  ] },
]

[plugin]
prepend_previewers = [
  { url = "*.{docx,doc,pptx,ppt}", run = "docx-preview" },
  { url = "*.{xlsx,xls,csv,tsv}", run = "excel-preview" },
  { url = "*.json", run = "duckdb" },
  { url = "*.parquet", run = "duckdb" },
  # { url = "*.txt", run = "duckdb" },
  { url = "*.db", run = "duckdb" },
  { url = "*.duckdb", run = "duckdb" },
  # For archive preview, using plugin ouch.yazi
  # This provides a tree view of the compressed folder
  # but not preview of each compressed file.
  { mime = "application/{*zip,tar,bzip2,7z*,rar,xz,zstd,java-archive}", run = "ouch" },
]
