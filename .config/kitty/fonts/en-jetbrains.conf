# English / Latin font: JetBrainsMono Nerd Font Mono
#
# The standard "Regular" weight (400) feels too heavy, so the Light weight
# (300) is used as the primary face.
#
font_family          JetBrainsMono Nerd Font Mono Light
bold_font            JetBrainsMono Nerd Font Mono
italic_font          JetBrainsMono Nerd Font Mono Light Italic
bold_italic_font     JetBrainsMono Nerd Font Mono Italic

font_size            16

font_features        JetBrainsMonoNFM-Regular +cv11 +cv12 +cv18
font_features        JetBrainsMonoNFM-Light +cv11 +cv12 +cv18
font_features        JetBrainsMonoNFM-ExtraLight +cv11 +cv12 +cv18
font_features        JetBrainsMonoNFM-SemiBold +cv11 +cv12 +cv18
font_features        JetBrainsMonoNFM-Italic +cv12 +cv16 +cv18 +cv19 +cv20
font_features        JetBrainsMonoNFM-SemiBoldItalic +ss02 +cv12 +cv16 +cv18 +cv19 +cv20

# Nerd Font symbols (icons are not built into the Mono variant)
symbol_map           U+23FB-U+23FE,U+2665,U+26A1,U+2B58,U+E000-U+E00A,U+E0A0-U+E0A3,U+E0B0-U+E0D4,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6AA,U+E700-U+E7C5,U+EA60-U+EBEB,U+F000-U+F2E0,U+F300-U+F32F,U+F400-U+F4A9,U+F500-U+F8FF,U+F0001-U+F1AF0 Symbols Nerd Font
