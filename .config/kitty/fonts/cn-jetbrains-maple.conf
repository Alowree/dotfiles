# Chinese / CJK font: JetBrains Maple Mono (JetBrainsMono x Maple Mono)
#
# A combination of JetBrainsMono and Maple Mono that also ships CJK glyphs.
# Map the CJK unified ideographs to it so Chinese text renders 2 cells wide
# instead of falling back to the Latin font.
#
symbol_map U+4E00-U+9FFF,U+3400-U+4DBF JetBrains Maple Mono
