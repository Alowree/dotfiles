background {
    monitor =
    path = /home/alowree/Pictures/Wallpapers/alien_planet.jpeg
    reload_cmd = shuf -n1 -e /home/alowree/Pictures/Wallpapers/*
    reload_time = 60
    crossfade_time = 2
    blur_passes = 4
    blur_size = 8
}

# TIME
label {
    monitor =
    text = $TIME
    color = rgba(255,255,255,0.9)
    font_size = 48
    font_family = JetBrainsMono Nerd Font

    position = 0, 100
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:3600000] date "+%a %b %d"
    color = rgba(255,255,255,0.7)
    font_size = 24
    font_family = JetBrainsMono Nerd Font

    position = 0, 40
    halign = center
    valign = center
}

# Password input
input-field {
    monitor =
    size = 320, 55

    outline_thickness = 2
    rounding = 12
    # fade_on_empty = false

    inner_color = rgba(0,0,0,0.4)
    outer_color = rgba(255,255,255,0.4)

    fail_color = rgba(255,0,0,0.5)

    placeholder_text = Enter password...
    font_color = rgba(255,255,255,0.5)
  

    font_family = JetBrainsMono Nerd Font
    font_size = 18

    position = 0, -50
    halign = center
    valign = center
